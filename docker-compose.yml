version: '3.8'

services:
  mes-desktop:
    build: .
    image: mes-desktop:1.0.0
    container_name: mes-desktop
    ports:
      - "6080:6080"
      - "5900:5900"
    environment:
      - VNC_PASSWORD=mes123
      - DISPLAY=:0
    volumes:
      - mes-data:/app/data
    restart: unless-stopped

volumes:
  mes-data:
